<!-- gift.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Hunt</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, pink, red);
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            color: yellow;
        }
        .hidden {
            display: none;
        }
    </style>
    <script>
        function showPasswordInput() {
            document.getElementById('password-container').classList.remove('hidden');
        }
        function checkPassword() {
            let password = document.getElementById('password').value;
            if (password === "ILOVEMYBF") {
                alert("HIII");
            } else {
                alert("Wrong password, try again!");
            }
        }
    </script>
</head>
<body>
    <h1>Look for your gift 🎁</h1>
    <button class="button" onclick="showPasswordInput()">Enter Gift Password</button>
    <div id="password-container" class="hidden">
        <h2>Enter the Gift Password:</h2>
        <input type="text" id="password" placeholder="Enter password">
        <button class="button" onclick="checkPassword()">Submit</button>
    </div>
</body>
</html>
