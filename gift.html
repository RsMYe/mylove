<!-- Gift Page (gift.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Gift</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, pink, red);
            font-family: Arial, sans-serif;
            color: white;
        }
        .hidden-button {
            position: absolute;
            top: 80%;
            left: 10%;
            opacity: 0;
            width: 50px;
            height: 50px;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <h1>Look for your gift 🎁</h1>
    <button class="hidden-button" onclick="askPassword()"></button>
    
    <script>
        function askPassword() {
            let password = prompt("Enter the gift password:");
            if (password === "14/12") {
                alert("Congratulations! You found your gift |here|🎁❤️");
            } else {
                alert("Wrong password! Keep looking.");
            }
        }
    </script>
</body>
</html>
