<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, pink, red);
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            color: yellow;
        }
        .container {
            margin-top: 50px;
        }
        .button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .yes-button {
            background-color: gold;
            color: red;
        }
        .no-button {
            background-color: grey;
            color: white;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>Will You Be My Valentine? 💛</h1>
    <div class="container">
        <button class="button yes-button" onclick="window.location.href='love.html'">Yes</button>
        <button class="button no-button">No</button>
    </div>
</body>
</html>
