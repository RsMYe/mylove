<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, pink, red);
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }
        h1 {
            color: yellow;
        }
        .container {
            margin-top: 50px;
            position: relative;
        }
        .button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: absolute;
            transition: 0.3s;
        }
        .yes-button {
            background-color: gold;
            color: red;
            left: 45%;
            top: 50%;
        }
        .no-button {
            background-color: grey;
            color: white;
            left: 55%;
            top: 50%;
            pointer-events: none;
        }
        .balloon, .rose, .cherry-blossom {
            position: absolute;
            width: 50px;
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(100vh); }
            100% { transform: translateY(-10vh); }
        }
    </style>
</head>
