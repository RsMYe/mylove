<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, pink, red);
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }
        h1 {
            color: yellow;
        }
        .container {
            margin-top: 50px;
            position: relative;
        }
        .button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: absolute;
            transition: 0.3s;
        }
        .yes-button {
            background-color: gold;
            color: red;
            left: 45%;
            top: 50%;
        }
        .no-button {
            background-color: grey;
            color: white;
            left: 55%;
            top: 50%;
            pointer-events: none;
        }
        .balloon, .rose, .cherry-blossom {
            position: absolute;
            width: 50px;
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(100vh); }
            100% { transform: translateY(-10vh); }
        }
    </style>
</head>
<body>
    <h1>Will You Be My Valentine? 💛</h1>
    <div class="container">
        <button class="button yes-button" onclick="window.location.href='love.html'">Yes</button>
        <button class="button no-button" id="noButton">No</button>
    </div>
    
    <script>
        function createFloatingElements() {
            for (let i = 0; i < 10; i++) {
                let balloon = document.createElement('img');
                balloon.src = 'https://upload.wikimedia.org/wikipedia/commons/5/59/Balloon_red.svg';
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * window.innerWidth + 'px';
                document.body.appendChild(balloon);
            }
            for (let i = 0; i < 5; i++) {
                let rose = document.createElement('img');
                rose.src = 'https://upload.wikimedia.org/wikipedia/commons/3/3b/Rose.png';
                rose.className = 'rose';
                rose.style.left = Math.random() * window.innerWidth + 'px';
                document.body.appendChild(rose);
            }
        }
        createFloatingElements();

        const noButton = document.getElementById("noButton");
        document.addEventListener("mousemove", function(event) {
            let rect = noButton.getBoundingClientRect();
            let distance = Math.sqrt(
                Math.pow(event.clientX - (rect.left + rect.width / 2), 2) +
                Math.pow(event.clientY - (rect.top + rect.height / 2), 2)
            );
            if (distance < 100) {
                let newX = Math.random() * (window.innerWidth - rect.width);
                let newY = Math.random() * (window.innerHeight - rect.height);
                noButton.style.left = newX + "px";
                noButton.style.top = newY + "px";
            }
        });
    </script>
</body>
</html>
